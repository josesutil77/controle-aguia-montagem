<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Controle de Equipes — Águia Montagem</title>
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#171D24">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
<script src="config.js"></script>
<style>
  :root {
    --bg: #171D24;
    --panel: #212932;
    --panel-2: #262F3A;
    --border: #38424D;
    --text: #E8EAED;
    --text-dim: #9AA5B1;
    --accent: #E8A33D;
    --active: #3FA796;
    --active-bg: rgba(63,167,150,0.14);
    --inactive: #C24C4C;
    --inactive-bg: rgba(194,76,76,0.14);
    --semdata: #6B7684;
    --semdata-bg: rgba(107,118,132,0.14);
  }
  :root:not([data-theme="light"]) { color-scheme: dark; }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--text); font-family: 'IBM Plex Sans', sans-serif; min-height: 100vh; }
  .app { max-width: 1280px; margin: 0 auto; padding: 26px 20px 60px; }

  h1 {
    font-family: 'Barlow Condensed', sans-serif;
    font-weight: 700; font-size: 32px; letter-spacing: 0.5px; margin: 0 0 2px;
    text-transform: uppercase; border-left: 5px solid var(--accent); padding-left: 12px;
  }
  .subtitle { color: var(--text-dim); font-size: 14px; padding-left: 17px; margin-top: 2px; }
  .header-row { display: flex; justify-content: space-between; align-items: flex-start; gap: 12px; flex-wrap: wrap; }

  .toolbar { display: flex; gap: 10px; margin: 20px 0 16px; flex-wrap: wrap; align-items: center; }
  input[type="text"], input[type="password"], input[type="email"], input[type="date"] {
    background: var(--panel); border: 1px solid var(--border); color: var(--text);
    padding: 11px 14px; border-radius: 6px; font-size: 15px; font-family: inherit;
  }
  input[type="text"] { flex: 1; min-width: 200px; }
  input:focus, select:focus { outline: none; border-color: var(--accent); }
  button.primary {
    background: var(--accent); color: #21170a; border: none; font-weight: 600; font-size: 15px;
    padding: 11px 18px; border-radius: 6px; cursor: pointer; font-family: inherit; white-space: nowrap;
  }
  button.primary:hover { filter: brightness(1.08); }
  button.primary:disabled { opacity: 0.6; cursor: default; }
  button.ghost {
    background: transparent; color: var(--text-dim); border: 1px solid var(--border);
    padding: 9px 13px; border-radius: 6px; cursor: pointer; font-family: inherit; font-size: 13px;
  }
  button.ghost:hover { color: var(--text); border-color: var(--text-dim); }

  .modtabs { display: flex; gap: 4px; margin-bottom: 18px; border-bottom: 1px solid var(--border); overflow-x: auto; }
  .modtab {
    padding: 10px 16px; cursor: pointer; color: var(--text-dim); font-size: 14px; font-weight: 500;
    border-bottom: 2px solid transparent; margin-bottom: -1px; white-space: nowrap;
  }
  .modtab.active { color: var(--text); border-bottom-color: var(--accent); }

  .tabs { display: flex; gap: 4px; margin-bottom: 4px; border-bottom: 1px solid var(--border); }
  .tab {
    padding: 10px 18px; cursor: pointer; color: var(--text-dim); font-size: 15px; font-weight: 500;
    border-bottom: 2px solid transparent; margin-bottom: -1px;
  }
  .tab.active { color: var(--text); border-bottom-color: var(--accent); }
  .tab .count { font-family: 'IBM Plex Mono', monospace; font-size: 12px; margin-left: 4px; color: var(--text-dim); }

  .chips { display: flex; gap: 8px; flex-wrap: wrap; margin: 16px 0; }
  .chip { border: 1px solid var(--border); background: var(--panel); color: var(--text-dim); padding: 6px 12px; border-radius: 999px; font-size: 13px; cursor: pointer; }
  .chip.active { border-color: var(--accent); color: var(--accent); background: rgba(232,163,61,0.1); }

  .table-wrap { overflow-x: auto; border: 1px solid var(--border); border-radius: 8px; }
  table { width: 100%; border-collapse: collapse; font-size: 14px; min-width: 950px; }
  thead th {
    text-align: left; padding: 11px 14px; background: var(--panel-2); color: var(--text-dim);
    font-size: 12px; text-transform: uppercase; letter-spacing: 0.3px; font-weight: 600;
    border-bottom: 1px solid var(--border); white-space: nowrap;
  }
  tbody td { padding: 12px 14px; border-bottom: 1px solid var(--border); background: var(--panel); vertical-align: middle; }
  tbody tr:last-child td { border-bottom: none; }
  tbody tr:hover td { background: var(--panel-2); }
  td.nome { font-weight: 600; }
  td.mono { font-family: 'IBM Plex Mono', monospace; font-size: 13px; color: var(--text-dim); }
  .badge { font-size: 11px; font-family: 'IBM Plex Mono', monospace; padding: 4px 9px; border-radius: 5px; white-space: nowrap; display: inline-block; }
  .badge.ativo, .badge.ok { background: var(--active-bg); color: var(--active); }
  .badge.inativo, .badge.vencido { background: var(--inactive-bg); color: var(--inactive); }
  .badge.vencendo { background: rgba(232,163,61,0.14); color: var(--accent); }
  .badge.semdata { background: var(--semdata-bg); color: var(--semdata); }
  .row-actions { display: flex; gap: 6px; white-space: nowrap; }
  .icon-btn {
    background: transparent; border: 1px solid var(--border); color: var(--text-dim);
    padding: 6px 10px; border-radius: 5px; cursor: pointer; font-size: 12px; font-family: inherit;
  }
  .icon-btn:hover { color: var(--text); border-color: var(--text-dim); }
  .icon-btn.reativar { color: var(--active); border-color: var(--active); }
  .icon-btn.inativar { color: var(--inactive); border-color: var(--inactive); }

  .inativos-list { display: flex; flex-direction: column; gap: 6px; }
  .inativo-row {
    display: flex; justify-content: space-between; align-items: center; gap: 12px;
    background: var(--panel); border: 1px solid var(--border); border-radius: 7px; padding: 11px 14px;
  }
  .inativo-info { min-width: 0; }
  .inativo-nome { font-weight: 500; opacity: 0.85; }
  .inativo-meta { color: var(--text-dim); font-size: 12px; margin-top: 2px; }

  .empty { text-align: center; color: var(--text-dim); padding: 50px 20px; border: 1px dashed var(--border); border-radius: 10px; }
  .banner { padding: 12px 16px; border-radius: 8px; font-size: 13px; margin-bottom: 16px; }
  .banner.warn { background: rgba(232,163,61,0.12); border: 1px solid var(--accent); color: var(--accent); }
  .banner.error { background: var(--inactive-bg); border: 1px solid var(--inactive); color: var(--inactive); }

  .overlay { position: fixed; inset: 0; background: rgba(0,0,0,0.55); display: flex; align-items: flex-start; justify-content: center; padding: 40px 16px; overflow-y: auto; z-index: 10; }
  .modal { background: var(--panel); border: 1px solid var(--border); border-radius: 10px; padding: 26px; width: 100%; max-width: 560px; }
  .modal h2 { font-family: 'Barlow Condensed', sans-serif; text-transform: uppercase; font-size: 22px; margin: 0 0 18px; letter-spacing: 0.4px; }
  .field { margin-bottom: 14px; }
  .field label { display: block; font-size: 12px; color: var(--text-dim); margin-bottom: 5px; text-transform: uppercase; letter-spacing: 0.4px; }
  .field input, .field select { width: 100%; background: var(--panel-2); border: 1px solid var(--border); color: var(--text); padding: 10px 12px; border-radius: 6px; font-size: 14px; font-family: inherit; }
  .field input:focus, .field select:focus { outline: none; border-color: var(--accent); }
  .field .hint { font-size: 11px; color: var(--text-dim); margin-top: 4px; }
  .grid2 { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
  @media (max-width: 520px) { .grid2 { grid-template-columns: 1fr; } }
  .modal-actions { display: flex; justify-content: space-between; align-items: center; margin-top: 20px; gap: 10px; flex-wrap: wrap; }
  .status-toggle { display: flex; gap: 8px; }
  .status-btn { padding: 9px 14px; border-radius: 6px; font-size: 13px; cursor: pointer; border: 1px solid var(--border); background: transparent; color: var(--text-dim); font-family: inherit; }
  .status-btn.on.ativo { background: var(--active-bg); color: var(--active); border-color: var(--active); }
  .status-btn.on.inativo { background: var(--inactive-bg); color: var(--inactive); border-color: var(--inactive); }
  .save-row { display: flex; gap: 10px; }
  .loading { color: var(--text-dim); padding: 40px; text-align: center; }

  .login-wrap { min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 20px; }
  .login-box { background: var(--panel); border: 1px solid var(--border); border-radius: 12px; padding: 32px; width: 100%; max-width: 380px; }
  .login-box h1 { font-size: 26px; }
  .login-box .subtitle { padding-left: 0; margin-bottom: 20px; }
  .login-box .field { margin-bottom: 14px; }
  .login-box button.primary { width: 100%; margin-top: 6px; padding: 12px; }
  .error-msg { color: var(--inactive); font-size: 13px; margin-top: 10px; }
  .topbar { display: flex; justify-content: flex-end; margin-bottom: 6px; }
  .user-chip { font-size: 12px; color: var(--text-dim); display: flex; align-items: center; gap: 10px; }

  .group-header td { background: var(--panel-2); color: var(--accent); font-family: 'Barlow Condensed', sans-serif; text-transform: uppercase; letter-spacing: 0.4px; font-weight: 700; font-size: 13px; padding: 9px 14px; border-bottom: 1px solid var(--border); }
  .inline-input { background: transparent; border: 1px solid transparent; color: var(--text); padding: 5px 6px; border-radius: 4px; font-size: 13px; font-family: inherit; width: 100%; min-width: 108px; }
  .inline-input:hover { border-color: var(--border); }
  .inline-input:focus { border-color: var(--accent); background: var(--panel-2); outline: none; }
  select.inline-input { cursor: pointer; }
  .inline-input.st-vencido { background: var(--inactive-bg); border-color: var(--inactive); color: var(--inactive); font-weight: 600; }
  .inline-input.st-vencendo { background: rgba(232,163,61,0.14); border-color: var(--accent); color: var(--accent); font-weight: 600; }
  .inline-input.st-ok { background: var(--active-bg); border-color: var(--active); color: var(--active); font-weight: 600; }
  .inline-input.st-semdata { background: var(--semdata-bg); border-color: var(--semdata); color: var(--semdata); }
  .inline-input.st-vencido::-webkit-calendar-picker-indicator,
  .inline-input.st-vencendo::-webkit-calendar-picker-indicator,
  .inline-input.st-ok::-webkit-calendar-picker-indicator { filter: brightness(0.9) saturate(2); }
  .cell-stack { display: flex; flex-direction: column; gap: 4px; min-width: 130px; }
  .cell-stack .badge { align-self: flex-start; }
</style>
</head>
<body>
<div id="root" class="app"><div class="loading">Carregando...</div></div>

<script>
// ---------- Ligação com o banco de dados (Supabase) ----------
let supabaseClient = null;
let configPronta = false;
if (window.SUPABASE_URL && window.SUPABASE_ANON_KEY) {
  supabaseClient = window.supabase.createClient(window.SUPABASE_URL, window.SUPABASE_ANON_KEY);
  configPronta = true;
}

// ---------- Estado geral ----------
let sessao = null;
let carregado = false;
let erroLogin = '';
let salvando = false;
let moduloAtivo = 'cadastro';

// ---------- Cadastro de funcionários ----------
let funcionarios = [];
let abaAtiva = 'ativos';
let filtroEmpresa = 'Todas';
let busca = '';
let editando = null;
let erroCarregarFunc = '';

const CAMPOS_VAZIOS = {
  id: null, nome: '', moradia: '', telefone: '', cargo: '',
  empresa_cliente: '', empresa_registradora: '', categoria: 'Mensalista',
  salario: '', data_chegada: '', status: 'ativo'
};

// ---------- Módulos de vencimento (config-driven) ----------
const MODULOS = {
  epi: {
    tabela: 'vencimento_epi',
    titulo: 'Vencimento de Fichas de EPI',
    subtitulo: 'Assinatura mensal',
    limiteAlerta: 5,
    campos: [
      { id: 'data_inicial', label: 'Data inicial', tipo: 'date' },
      { id: 'data_final', label: 'Data final (vencimento)', tipo: 'date', vencimento: true },
      { id: 'empresa_registrado', label: 'Empresa registrado', tipo: 'text', origemCadastro: 'empresa_registradora' },
      { id: 'assinatura', label: 'Assinatura', tipo: 'select', opcoes: ['PENDENTE', 'OK'] }
    ]
  },
  exames: {
    tabela: 'vencimento_exames',
    titulo: 'Vencimento de Exames',
    subtitulo: 'Periódico anual',
    campos: [
      { id: 'data_exame', label: 'Data do exame', tipo: 'date' },
      { id: 'data_prox_exame', label: 'Data do próximo exame', tipo: 'date', vencimento: true },
      { id: 'empresa_registrado', label: 'Empresa registrado', tipo: 'text', origemCadastro: 'empresa_registradora' },
      { id: 'assinatura', label: 'Assinatura', tipo: 'select', opcoes: ['PENDENTE', 'OK'] }
    ]
  },
  nrs: {
    tabela: 'vencimento_nrs',
    titulo: 'Vencimento de NRs',
    subtitulo: 'NR-33 e NR-34: 1 ano · NR-35: 2 anos',
    campos: [
      { id: 'nr33_vencimento', label: 'NR-33 (vencimento)', tipo: 'date', vencimento: true },
      { id: 'nr34_vencimento', label: 'NR-34 (vencimento)', tipo: 'date', vencimento: true },
      { id: 'nr35_vencimento', label: 'NR-35 (vencimento)', tipo: 'date', vencimento: true },
      { id: 'assinatura', label: 'Assinatura', tipo: 'select', opcoes: ['PENDENTE', 'OK', 'NÃO'] }
    ]
  },
  convocacoes: {
    tabela: 'convocacoes',
    titulo: 'Controle de Convocações',
    subtitulo: 'Intermitente e experiência',
    limiteAlerta: 3,
    campos: [
      { id: 'data_inicial', label: 'Data inicial', tipo: 'date' },
      { id: 'data_final', label: 'Data final', tipo: 'date', vencimento: true },
      { id: 'empresa_prestacao_servicos', label: 'Empresa (prestação de serviços)', tipo: 'text', origemCadastro: 'empresa_cliente' },
      { id: 'contrato', label: 'Tipo de contrato', tipo: 'select', opcoes: ['EXPERIENCIA', 'INTERMITENTE'] },
      { id: 'assinatura', label: 'Assinatura', tipo: 'select', opcoes: ['PENDENTE', 'OK'] }
    ]
  },
  folgas: {
    tabela: 'folgas_campo',
    titulo: 'Folgas de Campo',
    subtitulo: '2 dias aos 2 meses fora, 3 aos 3, acumulando se não voltar',
    campos: [
      { id: 'inicio_trabalho', label: 'Início do período de trabalho', tipo: 'date' },
      { id: 'ultima_folga', label: 'Última folga tirada', tipo: 'date' },
      { id: 'obs', label: 'Observações', tipo: 'text' }
    ]
  }
};

let dadosModulo = { epi: [], exames: [], nrs: [], convocacoes: [], folgas: [] };
let carregadoModulo = { epi: false, exames: false, nrs: false, convocacoes: false, folgas: false };
let erroModulo = { epi: '', exames: '', nrs: '', convocacoes: '', folgas: '' };
let editandoModulo = null; // { modulo, dados }
let buscaModulo = '';
let abaModulo = 'ativos';

// ---------- Autenticação ----------
async function verificarSessao() {
  if (!configPronta) { carregado = true; render(); return; }
  const { data } = await supabaseClient.auth.getSession();
  sessao = data.session;
  if (sessao) await carregarFuncionarios();
  else { carregado = true; render(); }
}

async function fazerLogin(email, senha) {
  erroLogin = '';
  const { data, error } = await supabaseClient.auth.signInWithPassword({ email, password: senha });
  if (error) { erroLogin = 'E-mail ou senha incorretos.'; render(); return; }
  sessao = data.session;
  await carregarFuncionarios();
}

async function sair() {
  await supabaseClient.auth.signOut();
  sessao = null;
  funcionarios = [];
  dadosModulo = { epi: [], exames: [], nrs: [], convocacoes: [], folgas: [] };
  carregadoModulo = { epi: false, exames: false, nrs: false, convocacoes: false, folgas: false };
  moduloAtivo = 'cadastro';
  render();
}

// ---------- Datas / status de vencimento ----------
function diasAte(dataStr) {
  if (!dataStr) return null;
  const hoje = new Date(); hoje.setHours(0, 0, 0, 0);
  const d = new Date(dataStr + 'T00:00:00');
  return Math.round((d - hoje) / 86400000);
}
function statusPorDias(dias, limiteAlerta) {
  if (limiteAlerta === undefined) limiteAlerta = 30;
  if (dias === null) return { cls: 'semdata', label: 'SEM DATA' };
  if (dias < 0) return { cls: 'vencido', label: 'VENCIDO' };
  if (dias === 0) return { cls: 'vencendo', label: 'VENCE HOJE' };
  if (dias <= 30) {
    const cls = dias <= limiteAlerta ? 'vencendo' : 'ok';
    return { cls, label: `${dias} DIA${dias === 1 ? '' : 'S'}` };
  }
  return { cls: 'ok', label: 'OK' };
}
function piorStatus(a, b) {
  const ordem = { vencido: 0, vencendo: 1, semdata: 2, ok: 3 };
  return ordem[a.cls] <= ordem[b.cls] ? a : b;
}
function statusLinha(config, item) {
  const camposVenc = config.campos.filter(c => c.vencimento);
  if (camposVenc.length === 0) return { cls: 'ok', label: 'OK' };
  const statusList = camposVenc.map(c => statusPorDias(diasAte(item[c.id]), config.limiteAlerta));
  const comData = statusList.filter(s => s.cls !== 'semdata');
  if (comData.length === 0) return { cls: 'semdata', label: 'SEM DATA' };
  return comData.reduce((pior, s) => piorStatus(pior, s));
}
function agruparPorEmpresa(itens, pegaEmpresa) {
  const grupos = {};
  itens.forEach(it => {
    const emp = pegaEmpresa(it) || 'Sem empresa definida';
    (grupos[emp] = grupos[emp] || []).push(it);
  });
  return Object.keys(grupos).sort((a, b) => a.localeCompare(b))
    .map(k => ({ empresa: k, itens: grupos[k].sort((a, b) => (a.nome || a._nome || a.funcionario_nome).localeCompare(b.nome || b._nome || b.funcionario_nome)) }));
}
function diasFolgaDevidos(item) {
  const ref = item.ultima_folga || item.inicio_trabalho;
  if (!ref) return 0;
  const hoje = new Date(); hoje.setHours(0, 0, 0, 0);
  const d = new Date(ref + 'T00:00:00');
  const meses = Math.floor((hoje - d) / (1000 * 60 * 60 * 24 * 30));
  return meses >= 2 ? meses : 0;
}

// ---------- Dados: Cadastro de funcionários ----------
async function carregarFuncionarios() {
  erroCarregarFunc = '';
  const { data, error } = await supabaseClient.from('funcionarios').select('*').order('nome', { ascending: true });
  if (error) { erroCarregarFunc = 'Não foi possível carregar os dados: ' + error.message; }
  else { funcionarios = data; }
  carregado = true;
  render();
}

function empresasClientes(lista) {
  const set = new Set(lista.map(f => f.empresa_cliente).filter(Boolean));
  return ['Todas', ...Array.from(set).sort()];
}
function aplicaFiltro(lista) {
  return lista.filter(f => {
    if (filtroEmpresa !== 'Todas' && f.empresa_cliente !== filtroEmpresa) return false;
    if (busca && !f.nome.toLowerCase().includes(busca.toLowerCase())) return false;
    return true;
  }).sort((a, b) => a.nome.localeCompare(b.nome));
}

function abrirNovo() { editando = { ...CAMPOS_VAZIOS, status: abaAtiva === 'inativos' ? 'inativo' : 'ativo' }; render(); }
function abrirEdicao(f) { editando = { ...f }; render(); }
function fecharModal() { editando = null; render(); }

async function salvarFuncionario(dados) {
  salvando = true; render();
  if (dados.id) {
    const { error } = await supabaseClient.from('funcionarios').update(dados).eq('id', dados.id);
    if (error) { alert('Erro ao salvar: ' + error.message); salvando = false; render(); return; }
  } else {
    delete dados.id;
    const { error } = await supabaseClient.from('funcionarios').insert(dados);
    if (error) { alert('Erro ao salvar: ' + error.message); salvando = false; render(); return; }
  }
  salvando = false; editando = null;
  await carregarFuncionarios();
}
async function toggleStatus(id) {
  const f = funcionarios.find(x => x.id === id);
  if (!f) return;
  const novoStatus = f.status === 'ativo' ? 'inativo' : 'ativo';
  const { error } = await supabaseClient.from('funcionarios').update({ status: novoStatus }).eq('id', id);
  if (error) { alert('Erro ao atualizar status: ' + error.message); return; }
  await carregarFuncionarios();
}
async function excluirFuncionario(id) {
  if (!confirm('Excluir este cadastro permanentemente? Se a pessoa puder voltar, prefira manter como "Inativo".')) return;
  const { error } = await supabaseClient.from('funcionarios').delete().eq('id', id);
  if (error) { alert('Erro ao excluir: ' + error.message); return; }
  editando = null;
  await carregarFuncionarios();
}

// ---------- Dados: Módulos de vencimento ----------
async function carregarModulo(chave) {
  const config = MODULOS[chave];
  erroModulo[chave] = '';
  const { data, error } = await supabaseClient.from(config.tabela).select('*').order('funcionario_nome', { ascending: true });
  if (error) { erroModulo[chave] = 'Não foi possível carregar: ' + error.message; }
  else { dadosModulo[chave] = data; }
  carregadoModulo[chave] = true;
  render();
}

function abrirNovoModulo(chave) {
  const vazio = { id: null, funcionario_id: '', funcionario_nome: '' };
  MODULOS[chave].campos.forEach(c => vazio[c.id] = c.tipo === 'select' ? c.opcoes[0] : '');
  editandoModulo = { modulo: chave, dados: vazio };
  render();
}
function fecharModalModulo() { editandoModulo = null; render(); }

async function atualizarCampoInline(chave, id, campo, valor) {
  const { error } = await supabaseClient.from(MODULOS[chave].tabela).update({ [campo]: valor || null }).eq('id', id);
  if (error) { alert('Erro ao salvar: ' + error.message); return; }
  await carregarModulo(chave);
}

async function salvarRegistroModulo() {
  const { modulo, dados } = editandoModulo;
  const config = MODULOS[modulo];
  if (!dados.funcionario_id) { alert('Selecione o funcionário.'); return; }
  const funcionario = funcionarios.find(f => f.id === dados.funcionario_id);
  const registro = { funcionario_id: dados.funcionario_id, funcionario_nome: funcionario ? funcionario.nome : dados.funcionario_nome };
  config.campos.forEach(c => registro[c.id] = dados[c.id] || null);

  salvando = true; render();
  const { error } = await supabaseClient.from(config.tabela).insert(registro);
  if (error) { alert('Erro ao salvar: ' + error.message); salvando = false; render(); return; }
  salvando = false; editandoModulo = null;
  await carregarModulo(modulo);
}

async function excluirRegistroModulo(chave, id) {
  if (!confirm('Excluir este registro?')) return;
  const { error } = await supabaseClient.from(MODULOS[chave].tabela).delete().eq('id', id);
  if (error) { alert('Erro ao excluir: ' + error.message); return; }
  await carregarModulo(chave);
}

function esc(s) { return (s || '').toString().replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c])); }
function fmtData(iso) {
  if (!iso) return '—';
  const [a, m, d] = iso.split('-');
  return `${d}/${m}/${a}`;
}

function classeAssinatura(valor) {
  if (valor === 'OK') return 'st-ok';
  if (valor === 'NÃO') return 'st-vencido';
  if (valor === 'PENDENTE') return 'st-vencendo';
  return 'st-semdata';
}
function inlineDate(chave, item, campoId, vencimento, limiteAlerta) {
  const cls = vencimento ? 'st-' + statusPorDias(diasAte(item[campoId]), limiteAlerta).cls : '';
  return `<input class="inline-input ${cls}" type="date" data-mod="${chave}" data-id="${item.id}" data-campo="${campoId}" value="${esc(item[campoId] || '')}">`;
}
function inlineSelect(chave, item, campo) {
  const cls = campo.id === 'assinatura' ? classeAssinatura(item[campo.id]) : '';
  return `<select class="inline-input ${cls}" data-mod="${chave}" data-id="${item.id}" data-campo="${campo.id}">
    ${campo.opcoes.map(o => `<option ${item[campo.id] === o ? 'selected' : ''}>${o}</option>`).join('')}
  </select>`;
}
function inlineText(chave, item, campoId) {
  return `<input class="inline-input" type="text" data-mod="${chave}" data-id="${item.id}" data-campo="${campoId}" value="${esc(item[campoId] || '')}">`;
}

function renderModuloGenerico(chave) {
  const config = MODULOS[chave];
  if (!carregadoModulo[chave]) { carregarModulo(chave); return '<div class="loading">Carregando...</div>'; }
  if (erroModulo[chave]) return `<div class="banner error">${esc(erroModulo[chave])}</div>`;

  const mapaFunc = {};
  funcionarios.forEach(f => mapaFunc[f.id] = f);

  let itens = dadosModulo[chave]
    .map(item => {
      const f = mapaFunc[item.funcionario_id] || null;
      return { ...item, _funcionario: f, _nome: f ? f.nome : item.funcionario_nome };
    })
    .filter(item => !buscaModulo || item._nome.toLowerCase().includes(buscaModulo.toLowerCase()))
    .filter(item => {
      const status = item._funcionario ? item._funcionario.status : 'ativo';
      return status === (abaModulo === 'ativos' ? 'ativo' : 'inativo');
    });

  const ativosCount = dadosModulo[chave].filter(i => { const f = mapaFunc[i.funcionario_id]; return (f ? f.status : 'ativo') === 'ativo'; }).length;
  const inativosCount = dadosModulo[chave].filter(i => { const f = mapaFunc[i.funcionario_id]; return (f ? f.status : 'ativo') === 'inativo'; }).length;

  const grupos = agruparPorEmpresa(itens, item => item._funcionario ? item._funcionario.empresa_cliente : 'Sem vínculo ao cadastro');

  let conteudo;
  if (!itens.length) {
    conteudo = `<div class="empty">Nenhum registro encontrado.</div>`;
  } else if (chave === 'folgas') {
    const linhasGrupo = grupos.map(g => `
      <tr class="group-header"><td colspan="6">${esc(g.empresa)} · ${g.itens.length}</td></tr>
      ${g.itens.map(item => {
        const dias = diasFolgaDevidos(item);
        return `
        <tr>
          <td class="nome">${esc(item._nome)}</td>
          <td>${inlineDate(chave, item, 'inicio_trabalho')}</td>
          <td>${inlineDate(chave, item, 'ultima_folga')}</td>
          <td>${dias > 0 ? `<span class="badge vencendo">${dias} DIA${dias === 1 ? '' : 'S'}</span>` : `<span class="badge ok">OK</span>`}</td>
          <td>${inlineText(chave, item, 'obs')}</td>
          <td><button class="icon-btn inativar" data-mod-del="${item.id}" data-mod="${chave}">Excluir</button></td>
        </tr>`;
      }).join('')}
    `).join('');
    conteudo = `<div class="table-wrap"><table>
      <thead><tr><th>Nome</th><th>Início trabalho</th><th>Última folga</th><th>Dias devidos</th><th>Observações</th><th></th></tr></thead>
      <tbody>${linhasGrupo}</tbody>
    </table></div>`;
  } else if (chave === 'nrs') {
    const camposNr = config.campos.filter(c => c.vencimento);
    const linhasGrupo = grupos.map(g => `
      <tr class="group-header"><td colspan="${camposNr.length + 3}">${esc(g.empresa)} · ${g.itens.length}</td></tr>
      ${g.itens.map(item => `
        <tr>
          <td class="nome">${esc(item._nome)}</td>
          ${camposNr.map(c => {
            const s = statusPorDias(diasAte(item[c.id]), config.limiteAlerta);
            return `<td><div class="cell-stack">${inlineDate(chave, item, c.id, true, config.limiteAlerta)}<span class="badge ${s.cls}">${s.label}</span></div></td>`;
          }).join('')}
          <td>${inlineSelect(chave, item, config.campos.find(c => c.id === 'assinatura'))}</td>
          <td><button class="icon-btn inativar" data-mod-del="${item.id}" data-mod="${chave}">Excluir</button></td>
        </tr>
      `).join('')}
    `).join('');
    conteudo = `<div class="table-wrap"><table>
      <thead><tr><th>Nome</th>${camposNr.map(c => `<th>${c.label}</th>`).join('')}<th>Assinatura</th><th></th></tr></thead>
      <tbody>${linhasGrupo}</tbody>
    </table></div>`;
  } else {
    const linhasGrupo = grupos.map(g => `
      <tr class="group-header"><td colspan="${config.campos.length + 3}">${esc(g.empresa)} · ${g.itens.length}</td></tr>
      ${g.itens.map(item => {
        const status = statusLinha(config, item);
        return `
        <tr>
          <td class="nome">${esc(item._nome)}</td>
          ${config.campos.map(c => {
            if (c.origemCadastro) {
              const valor = item._funcionario ? item._funcionario[c.origemCadastro] : item[c.id];
              return `<td class="mono">${esc(valor || '—')}</td>`;
            }
            if (c.tipo === 'date') return `<td>${inlineDate(chave, item, c.id, !!c.vencimento, config.limiteAlerta)}</td>`;
            if (c.tipo === 'select') return `<td>${inlineSelect(chave, item, c)}</td>`;
            return `<td>${inlineText(chave, item, c.id)}</td>`;
          }).join('')}
          <td><span class="badge ${status.cls}">${status.label}</span></td>
          <td><button class="icon-btn inativar" data-mod-del="${item.id}" data-mod="${chave}">Excluir</button></td>
        </tr>`;
      }).join('')}
    `).join('');
    conteudo = `<div class="table-wrap"><table>
      <thead><tr><th>Nome</th>${config.campos.map(c => `<th>${c.label}</th>`).join('')}<th>Status</th><th></th></tr></thead>
      <tbody>${linhasGrupo}</tbody>
    </table></div>`;
  }

  return `
    <h1 style="font-size:24px">${config.titulo}</h1>
    <div class="subtitle" style="padding-left:0;margin-bottom:16px">${config.subtitulo}</div>
    <div class="toolbar">
      <input type="text" id="busca-modulo" placeholder="Buscar por nome..." value="${esc(buscaModulo)}">
      <button class="primary" id="btn-novo-modulo" data-mod="${chave}">+ Novo registro</button>
    </div>
    <div class="tabs">
      <div class="tab ${abaModulo === 'ativos' ? 'active' : ''}" data-abamod="ativos">Ativos <span class="count">${ativosCount}</span></div>
      <div class="tab ${abaModulo === 'inativos' ? 'active' : ''}" data-abamod="inativos">Inativos <span class="count">${inativosCount}</span></div>
    </div>
    <div style="margin-bottom:16px"></div>
    ${conteudo}
  `;
}

function renderModalModulo() {
  if (!editandoModulo) return '';
  const { modulo, dados } = editandoModulo;
  const config = MODULOS[modulo];
  const opcoesFuncionarios = [...funcionarios].sort((a, b) => a.nome.localeCompare(b.nome));

  const camposHtml = config.campos.filter(c => !c.origemCadastro).map(c => {
    if (c.tipo === 'select') {
      return `
        <div class="field"><label>${c.label}</label>
          <select id="mf-${c.id}">
            ${c.opcoes.map(o => `<option ${dados[c.id] === o ? 'selected' : ''}>${o}</option>`).join('')}
          </select>
        </div>`;
    }
    if (c.tipo === 'date') {
      return `<div class="field"><label>${c.label}</label><input id="mf-${c.id}" type="date" value="${esc(dados[c.id])}"></div>`;
    }
    return `<div class="field"><label>${c.label}</label><input id="mf-${c.id}" type="text" value="${esc(dados[c.id])}"></div>`;
  }).join('');

  return `
    <div class="overlay" id="overlay-modulo">
      <div class="modal">
        <h2>Novo registro · ${config.titulo}</h2>
        <div class="field">
          <label>Funcionário</label>
          <select id="mf-funcionario">
            <option value="">— Selecione —</option>
            ${opcoesFuncionarios.map(f => `<option value="${f.id}" ${dados.funcionario_id === f.id ? 'selected' : ''}>${esc(f.nome)}${f.status === 'inativo' ? ' (inativo)' : ''}</option>`).join('')}
          </select>
        </div>
        ${camposHtml}
        <div class="modal-actions">
          <div></div>
          <div class="save-row">
            <button class="ghost" id="btn-cancelar-modulo">Cancelar</button>
            <button class="primary" id="btn-salvar-modulo" ${salvando ? 'disabled' : ''}>${salvando ? 'Salvando...' : 'Salvar'}</button>
          </div>
        </div>
      </div>
    </div>`;
}

function render() {
  const root = document.getElementById('root');

  if (!configPronta) { root.innerHTML = renderSemConfig(); return; }
  if (!carregado) { root.innerHTML = '<div class="loading">Carregando...</div>'; return; }
  if (!sessao) {
    root.innerHTML = renderLogin();
    document.getElementById('btn-login').addEventListener('click', () => {
      const email = document.getElementById('login-email').value.trim();
      const senha = document.getElementById('login-senha').value;
      fazerLogin(email, senha);
    });
    return;
  }

  const corpo = moduloAtivo === 'cadastro' ? renderCadastro() : renderModuloGenerico(moduloAtivo);

  root.innerHTML = `
    <div class="topbar">
      <div class="user-chip">${esc(sessao.user.email)} <button class="ghost" id="btn-sair">Sair</button></div>
    </div>
    <div class="header-row">
      <div>
        <h1>Controle de Equipes</h1>
        <div class="subtitle">Águia Montagem</div>
      </div>
    </div>
    ${renderModTabs()}
    ${corpo}
    ${renderModalFuncionario()}
    ${renderModalModulo()}
  `;

  document.getElementById('btn-sair').addEventListener('click', sair);
  document.querySelectorAll('.modtab').forEach(el => el.addEventListener('click', () => {
    moduloAtivo = el.dataset.mod; buscaModulo = ''; abaModulo = 'ativos'; render();
  }));

  if (moduloAtivo === 'cadastro') {
    document.getElementById('busca').addEventListener('input', e => { busca = e.target.value; render(); preservarFoco('busca'); });
    document.getElementById('btn-novo').addEventListener('click', abrirNovo);
    document.querySelectorAll('.tab').forEach(el => el.addEventListener('click', () => { abaAtiva = el.dataset.tab; filtroEmpresa = 'Todas'; render(); }));
    document.querySelectorAll('.chip').forEach(el => el.addEventListener('click', () => { filtroEmpresa = el.dataset.emp; render(); }));
    document.querySelectorAll('[data-edit]').forEach(el => el.addEventListener('click', () => {
      const f = funcionarios.find(x => x.id == el.dataset.edit);
      if (f) abrirEdicao(f);
    }));
    document.querySelectorAll('[data-toggle]').forEach(el => el.addEventListener('click', () => toggleStatus(el.dataset.toggle)));
  } else {
    const buscaEl = document.getElementById('busca-modulo');
    if (buscaEl) buscaEl.addEventListener('input', e => { buscaModulo = e.target.value; render(); preservarFoco('busca-modulo'); });
    const btnNovo = document.getElementById('btn-novo-modulo');
    if (btnNovo) btnNovo.addEventListener('click', () => abrirNovoModulo(btnNovo.dataset.mod));
    document.querySelectorAll('[data-abamod]').forEach(el => el.addEventListener('click', () => { abaModulo = el.dataset.abamod; render(); }));
    document.querySelectorAll('[data-mod-del]').forEach(el => el.addEventListener('click', () => excluirRegistroModulo(el.dataset.mod, el.dataset.modDel)));
    document.querySelectorAll('.inline-input[data-mod]').forEach(el => el.addEventListener('change', () => {
      atualizarCampoInline(el.dataset.mod, el.dataset.id, el.dataset.campo, el.value);
    }));
  }

  if (editando) {
    document.getElementById('overlay').addEventListener('click', (e) => { if (e.target.id === 'overlay') fecharModal(); });
    document.getElementById('btn-cancelar').addEventListener('click', fecharModal);
    document.getElementById('btn-ativo').addEventListener('click', () => { editando.status = 'ativo'; render(); });
    document.getElementById('btn-inativo').addEventListener('click', () => { editando.status = 'inativo'; render(); });
    if (editando.id) document.getElementById('btn-excluir').addEventListener('click', () => excluirFuncionario(editando.id));
    document.getElementById('btn-salvar').addEventListener('click', () => {
      const dados = {
        id: editando.id,
        nome: document.getElementById('f-nome').value.trim(),
        cargo: document.getElementById('f-cargo').value.trim(),
        categoria: document.getElementById('f-categoria').value,
        empresa_cliente: document.getElementById('f-empresaCliente').value.trim(),
        empresa_registradora: document.getElementById('f-empresaRegistradora').value.trim(),
        telefone: document.getElementById('f-telefone').value.trim(),
        salario: document.getElementById('f-salario').value.trim(),
        moradia: document.getElementById('f-moradia').value.trim(),
        data_chegada: document.getElementById('f-dataChegada').value || null,
        status: editando.status
      };
      if (!dados.nome) { alert('Informe o nome do funcionário.'); return; }
      salvarFuncionario(dados);
    });
  }

  if (editandoModulo) {
    const { modulo, dados } = editandoModulo;
    const config = MODULOS[modulo];
    document.getElementById('overlay-modulo').addEventListener('click', (e) => { if (e.target.id === 'overlay-modulo') fecharModalModulo(); });
    document.getElementById('btn-cancelar-modulo').addEventListener('click', fecharModalModulo);
    document.getElementById('mf-funcionario').addEventListener('change', e => { editandoModulo.dados.funcionario_id = e.target.value; });
    document.getElementById('btn-salvar-modulo').addEventListener('click', () => {
      config.campos.filter(c => !c.origemCadastro).forEach(c => {
        const el = document.getElementById(`mf-${c.id}`);
        editandoModulo.dados[c.id] = el.value.trim ? el.value.trim() : el.value;
      });
      salvarRegistroModulo();
    });
  }
}

function preservarFoco(id) {
  const el = document.getElementById(id);
  if (el) { const v = el.value; el.focus(); el.value = v; el.selectionStart = el.selectionEnd = v.length; }
}

// ---------- PWA: registra o "cuidador" que guarda uma cópia local do app ----------
if ('serviceWorker' in navigator) {
  window.addEventListener('load', () => {
    navigator.serviceWorker.register('sw.js').catch(() => {});
  });
}

verificarSessao();
</script>
</body>
</html>
