<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Controle de Equipes</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #171D24;
    --panel: #212932;
    --panel-2: #262F3A;
    --border: #38424D;
    --text: #E8EAED;
    --text-dim: #9AA5B1;
    --accent: #E8A33D;
    --active: #3FA796;
    --active-bg: rgba(63,167,150,0.14);
    --inactive: #C24C4C;
    --inactive-bg: rgba(194,76,76,0.14);
  }
  :root:not([data-theme="light"]) { color-scheme: dark; }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--text); font-family: 'IBM Plex Sans', sans-serif; min-height: 100vh; }
  .app { max-width: 1280px; margin: 0 auto; padding: 26px 20px 60px; }

  h1 {
    font-family: 'Barlow Condensed', sans-serif;
    font-weight: 700; font-size: 32px; letter-spacing: 0.5px; margin: 0 0 2px;
    text-transform: uppercase; border-left: 5px solid var(--accent); padding-left: 12px;
  }
  .subtitle { color: var(--text-dim); font-size: 14px; padding-left: 17px; margin-top: 2px; }

  .toolbar { display: flex; gap: 10px; margin: 20px 0 16px; flex-wrap: wrap; align-items: center; }
  input[type="text"] {
    background: var(--panel); border: 1px solid var(--border); color: var(--text);
    padding: 11px 14px; border-radius: 6px; font-size: 15px; font-family: inherit; flex: 1; min-width: 200px;
  }
  input[type="text"]:focus { outline: none; border-color: var(--accent); }
  button.primary {
    background: var(--accent); color: #21170a; border: none; font-weight: 600; font-size: 15px;
    padding: 11px 18px; border-radius: 6px; cursor: pointer; font-family: inherit; white-space: nowrap;
  }
  button.primary:hover { filter: brightness(1.08); }
  button.ghost {
    background: transparent; color: var(--text-dim); border: 1px solid var(--border);
    padding: 9px 13px; border-radius: 6px; cursor: pointer; font-family: inherit; font-size: 13px;
  }
  button.ghost:hover { color: var(--text); border-color: var(--text-dim); }

  .tabs { display: flex; gap: 4px; margin-bottom: 4px; border-bottom: 1px solid var(--border); }
  .tab {
    padding: 10px 18px; cursor: pointer; color: var(--text-dim); font-size: 15px; font-weight: 500;
    border-bottom: 2px solid transparent; margin-bottom: -1px;
  }
  .tab.active { color: var(--text); border-bottom-color: var(--accent); }
  .tab .count { font-family: 'IBM Plex Mono', monospace; font-size: 12px; margin-left: 4px; color: var(--text-dim); }

  .chips { display: flex; gap: 8px; flex-wrap: wrap; margin: 16px 0; }
  .chip { border: 1px solid var(--border); background: var(--panel); color: var(--text-dim); padding: 6px 12px; border-radius: 999px; font-size: 13px; cursor: pointer; }
  .chip.active { border-color: var(--accent); color: var(--accent); background: rgba(232,163,61,0.1); }

  .table-wrap { overflow-x: auto; border: 1px solid var(--border); border-radius: 8px; }
  table { width: 100%; border-collapse: collapse; font-size: 14px; min-width: 900px; }
  thead th {
    text-align: left; padding: 11px 14px; background: var(--panel-2); color: var(--text-dim);
    font-size: 12px; text-transform: uppercase; letter-spacing: 0.3px; font-weight: 600;
    border-bottom: 1px solid var(--border); white-space: nowrap;
  }
  tbody td { padding: 12px 14px; border-bottom: 1px solid var(--border); background: var(--panel); vertical-align: middle; }
  tbody tr:last-child td { border-bottom: none; }
  tbody tr:hover td { background: var(--panel-2); }
  td.nome { font-weight: 600; }
  td.mono { font-family: 'IBM Plex Mono', monospace; font-size: 13px; color: var(--text-dim); }
  .badge { font-size: 11px; font-family: 'IBM Plex Mono', monospace; padding: 4px 9px; border-radius: 5px; white-space: nowrap; }
  .badge.ativo { background: var(--active-bg); color: var(--active); }
  .badge.inativo { background: var(--inactive-bg); color: var(--inactive); }
  .row-actions { display: flex; gap: 6px; white-space: nowrap; }
  .icon-btn {
    background: transparent; border: 1px solid var(--border); color: var(--text-dim);
    padding: 6px 10px; border-radius: 5px; cursor: pointer; font-size: 12px; font-family: inherit;
  }
  .icon-btn:hover { color: var(--text); border-color: var(--text-dim); }
  .icon-btn.reativar { color: var(--active); border-color: var(--active); }
  .icon-btn.inativar { color: var(--inactive); border-color: var(--inactive); }

  /* Lista simples de inativos */
  .inativos-list { display: flex; flex-direction: column; gap: 6px; }
  .inativo-row {
    display: flex; justify-content: space-between; align-items: center; gap: 12px;
    background: var(--panel); border: 1px solid var(--border); border-radius: 7px; padding: 11px 14px;
  }
  .inativo-info { min-width: 0; }
  .inativo-nome { font-weight: 500; opacity: 0.85; }
  .inativo-meta { color: var(--text-dim); font-size: 12px; margin-top: 2px; }

  .empty { text-align: center; color: var(--text-dim); padding: 50px 20px; border: 1px dashed var(--border); border-radius: 10px; }

  .overlay { position: fixed; inset: 0; background: rgba(0,0,0,0.55); display: flex; align-items: flex-start; justify-content: center; padding: 40px 16px; overflow-y: auto; z-index: 10; }
  .modal { background: var(--panel); border: 1px solid var(--border); border-radius: 10px; padding: 26px; width: 100%; max-width: 560px; }
  .modal h2 { font-family: 'Barlow Condensed', sans-serif; text-transform: uppercase; font-size: 22px; margin: 0 0 18px; letter-spacing: 0.4px; }
  .field { margin-bottom: 14px; }
  .field label { display: block; font-size: 12px; color: var(--text-dim); margin-bottom: 5px; text-transform: uppercase; letter-spacing: 0.4px; }
  .field input, .field select { width: 100%; background: var(--panel-2); border: 1px solid var(--border); color: var(--text); padding: 10px 12px; border-radius: 6px; font-size: 14px; font-family: inherit; }
  .field input:focus, .field select:focus { outline: none; border-color: var(--accent); }
  .grid2 { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
  @media (max-width: 520px) { .grid2 { grid-template-columns: 1fr; } }
  .modal-actions { display: flex; justify-content: space-between; align-items: center; margin-top: 20px; gap: 10px; flex-wrap: wrap; }
  .status-toggle { display: flex; gap: 8px; }
  .status-btn { padding: 9px 14px; border-radius: 6px; font-size: 13px; cursor: pointer; border: 1px solid var(--border); background: transparent; color: var(--text-dim); font-family: inherit; }
  .status-btn.on.ativo { background: var(--active-bg); color: var(--active); border-color: var(--active); }
  .status-btn.on.inativo { background: var(--inactive-bg); color: var(--inactive); border-color: var(--inactive); }
  .save-row { display: flex; gap: 10px; }
  .loading { color: var(--text-dim); padding: 40px; text-align: center; }
</style>
</head>
<body>
<div id="root" class="app"><div class="loading">Carregando...</div></div>

<script>
const STORAGE_KEY = 'funcionarios_v1';
let funcionarios = [];
let abaAtiva = 'ativos'; // 'ativos' | 'inativos'
let filtroEmpresa = 'Todas';
let busca = '';
let editando = null;
let carregado = false;

const CAMPOS_VAZIOS = {
  id: null, nome: '', moradia: '', telefone: '', cargo: '',
  empresaCliente: '', empresaRegistradora: '', categoria: 'Mensalista',
  salario: '', status: 'ativo'
};

async function carregar() {
  try {
    const res = await window.storage.get(STORAGE_KEY, false);
    funcionarios = res ? JSON.parse(res.value) : seedDemo();
  } catch (e) {
    funcionarios = seedDemo();
  }
  carregado = true;
  render();
}

function seedDemo() {
  return [
    { id: 1, nome: 'Fulano de Tal (exemplo)', moradia: 'Casa própria', telefone: '49 90000-0000',
      cargo: 'Mecânico Montador', empresaCliente: 'Berneck', empresaRegistradora: 'Águia',
      categoria: 'Mensalista', salario: '4400', status: 'ativo' },
    { id: 2, nome: 'Ciclano da Silva (exemplo)', moradia: 'Casa Joelson', telefone: '41 90000-0000',
      cargo: 'Soldador', empresaCliente: 'Socer', empresaRegistradora: 'Por fora',
      categoria: 'Intermitente', salario: '22 (por hora)', status: 'inativo' }
  ];
}

async function salvar() {
  try { await window.storage.set(STORAGE_KEY, JSON.stringify(funcionarios), false); }
  catch (e) { console.error('Falha ao salvar', e); }
}

function empresasClientes(lista) {
  const set = new Set(lista.map(f => f.empresaCliente).filter(Boolean));
  return ['Todas', ...Array.from(set).sort()];
}

function aplicaFiltro(lista) {
  return lista.filter(f => {
    if (filtroEmpresa !== 'Todas' && f.empresaCliente !== filtroEmpresa) return false;
    if (busca && !f.nome.toLowerCase().includes(busca.toLowerCase())) return false;
    return true;
  }).sort((a,b) => a.nome.localeCompare(b.nome));
}

function abrirNovo() { editando = { ...CAMPOS_VAZIOS, status: abaAtiva === 'inativos' ? 'inativo' : 'ativo' }; render(); }
function abrirEdicao(f) { editando = { ...f }; render(); }
function fecharModal() { editando = null; render(); }

function salvarFuncionario(dados) {
  if (dados.id) { funcionarios = funcionarios.map(f => f.id === dados.id ? dados : f); }
  else { dados.id = Date.now(); funcionarios.push(dados); }
  salvar(); editando = null; render();
}

function toggleStatus(id) {
  funcionarios = funcionarios.map(f => f.id === id ? { ...f, status: f.status === 'ativo' ? 'inativo' : 'ativo' } : f);
  salvar(); render();
}

function excluirFuncionario(id) {
  if (!confirm('Excluir este cadastro permanentemente? Se a pessoa puder voltar, prefira manter como "Inativo".')) return;
  funcionarios = funcionarios.filter(f => f.id !== id);
  salvar(); editando = null; render();
}

function esc(s) { return (s || '').toString().replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }

function render() {
  const root = document.getElementById('root');
  if (!carregado) { root.innerHTML = '<div class="loading">Carregando...</div>'; return; }

  const ativos = funcionarios.filter(f => f.status === 'ativo');
  const inativos = funcionarios.filter(f => f.status === 'inativo');
  const listaBase = abaAtiva === 'ativos' ? ativos : inativos;
  const chips = empresasClientes(listaBase).map(emp =>
    `<div class="chip ${emp === filtroEmpresa ? 'active' : ''}" data-emp="${esc(emp)}">${esc(emp)}</div>`
  ).join('');
  const itens = aplicaFiltro(listaBase);

  let conteudoHtml = '';
  if (abaAtiva === 'ativos') {
    conteudoHtml = itens.length ? `
      <div class="table-wrap"><table>
        <thead><tr>
          <th>Nome</th><th>Cargo</th><th>Empresa cliente</th><th>Registrado em</th>
          <th>Categoria</th><th>Salário</th><th>Telefone</th><th>Status</th><th></th>
        </tr></thead>
        <tbody>
          ${itens.map(f => `
            <tr>
              <td class="nome">${esc(f.nome)}</td>
              <td>${esc(f.cargo || '—')}</td>
              <td>${esc(f.empresaCliente || '—')}</td>
              <td>${esc(f.empresaRegistradora || '—')}</td>
              <td>${esc(f.categoria || '—')}</td>
              <td class="mono">${esc(f.salario || '—')}</td>
              <td class="mono">${esc(f.telefone || '—')}</td>
              <td><span class="badge ativo">ATIVO</span></td>
              <td>
                <div class="row-actions">
                  <button class="icon-btn" data-edit="${f.id}">Editar</button>
                  <button class="icon-btn inativar" data-toggle="${f.id}">Inativar</button>
                </div>
              </td>
            </tr>
          `).join('')}
        </tbody>
      </table></div>
    ` : `<div class="empty">Nenhum funcionário ativo encontrado.</div>`;
  } else {
    conteudoHtml = itens.length ? `
      <div class="inativos-list">
        ${itens.map(f => `
          <div class="inativo-row">
            <div class="inativo-info">
              <div class="inativo-nome">${esc(f.nome)}</div>
              <div class="inativo-meta">${esc(f.cargo || '—')} · última empresa: ${esc(f.empresaCliente || '—')}</div>
            </div>
            <div class="row-actions">
              <button class="icon-btn" data-edit="${f.id}">Ver dados</button>
              <button class="icon-btn reativar" data-toggle="${f.id}">Reativar</button>
            </div>
          </div>
        `).join('')}
      </div>
    ` : `<div class="empty">Nenhum funcionário inativo no momento.</div>`;
  }

  let modalHtml = '';
  if (editando) {
    const d = editando;
    modalHtml = `
    <div class="overlay" id="overlay">
      <div class="modal">
        <h2>${d.id ? 'Editar funcionário' : 'Novo funcionário'}</h2>
        <div class="field"><label>Nome completo</label><input id="f-nome" type="text" value="${esc(d.nome)}"></div>
        <div class="grid2">
          <div class="field"><label>Cargo</label><input id="f-cargo" type="text" value="${esc(d.cargo)}"></div>
          <div class="field"><label>Categoria</label>
            <select id="f-categoria">
              ${['Mensalista','Intermitente','Experiência','Por fora','Por hora'].map(c => `<option ${d.categoria===c?'selected':''}>${c}</option>`).join('')}
            </select>
          </div>
        </div>
        <div class="grid2">
          <div class="field"><label>Empresa cliente (onde presta serviço)</label><input id="f-empresaCliente" type="text" value="${esc(d.empresaCliente)}" placeholder="Ex: Berneck, Itacol..."></div>
          <div class="field"><label>Empresa registradora</label><input id="f-empresaRegistradora" type="text" value="${esc(d.empresaRegistradora)}" placeholder="Ex: Águia, Delta, Por fora"></div>
        </div>
        <div class="grid2">
          <div class="field"><label>Telefone</label><input id="f-telefone" type="text" value="${esc(d.telefone)}"></div>
          <div class="field"><label>Salário</label><input id="f-salario" type="text" value="${esc(d.salario)}"></div>
        </div>
        <div class="field"><label>Moradia</label><input id="f-moradia" type="text" value="${esc(d.moradia)}"></div>
        <div class="field">
          <label>Status</label>
          <div class="status-toggle">
            <button type="button" class="status-btn ${d.status==='ativo'?'on ativo':''}" id="btn-ativo">Ativo</button>
            <button type="button" class="status-btn ${d.status==='inativo'?'on inativo':''}" id="btn-inativo">Inativo</button>
          </div>
        </div>
        <div class="modal-actions">
          <div>${d.id ? `<button class="ghost" id="btn-excluir">Excluir cadastro</button>` : ''}</div>
          <div class="save-row">
            <button class="ghost" id="btn-cancelar">Cancelar</button>
            <button class="primary" id="btn-salvar">Salvar</button>
          </div>
        </div>
      </div>
    </div>`;
  }

  root.innerHTML = `
    <header>
      <h1>Controle de Equipes</h1>
      <div class="subtitle">Cadastro central de funcionários · protótipo</div>
    </header>
    <div class="toolbar">
      <input type="text" id="busca" placeholder="Buscar por nome..." value="${esc(busca)}">
      <button class="primary" id="btn-novo">+ Novo funcionário</button>
    </div>
    <div class="tabs">
      <div class="tab ${abaAtiva==='ativos'?'active':''}" data-tab="ativos">Ativos <span class="count">${ativos.length}</span></div>
      <div class="tab ${abaAtiva==='inativos'?'active':''}" data-tab="inativos">Inativos <span class="count">${inativos.length}</span></div>
    </div>
    <div class="chips">${chips}</div>
    ${conteudoHtml}
    ${modalHtml}
  `;

  document.getElementById('busca').addEventListener('input', e => { busca = e.target.value; render(); preservarFoco('busca'); });
  document.getElementById('btn-novo').addEventListener('click', abrirNovo);
  document.querySelectorAll('.tab').forEach(el => el.addEventListener('click', () => { abaAtiva = el.dataset.tab; filtroEmpresa = 'Todas'; render(); }));
  document.querySelectorAll('.chip').forEach(el => el.addEventListener('click', () => { filtroEmpresa = el.dataset.emp; render(); }));
  document.querySelectorAll('[data-edit]').forEach(el => el.addEventListener('click', () => {
    const f = funcionarios.find(x => x.id == el.dataset.edit);
    if (f) abrirEdicao(f);
  }));
  document.querySelectorAll('[data-toggle]').forEach(el => el.addEventListener('click', () => toggleStatus(Number(el.dataset.toggle))));

  if (editando) {
    document.getElementById('overlay').addEventListener('click', (e) => { if (e.target.id === 'overlay') fecharModal(); });
    document.getElementById('btn-cancelar').addEventListener('click', fecharModal);
    document.getElementById('btn-ativo').addEventListener('click', () => { editando.status = 'ativo'; render(); });
    document.getElementById('btn-inativo').addEventListener('click', () => { editando.status = 'inativo'; render(); });
    if (editando.id) document.getElementById('btn-excluir').addEventListener('click', () => excluirFuncionario(editando.id));
    document.getElementById('btn-salvar').addEventListener('click', () => {
      const dados = {
        id: editando.id,
        nome: document.getElementById('f-nome').value.trim(),
        cargo: document.getElementById('f-cargo').value.trim(),
        categoria: document.getElementById('f-categoria').value,
        empresaCliente: document.getElementById('f-empresaCliente').value.trim(),
        empresaRegistradora: document.getElementById('f-empresaRegistradora').value.trim(),
        telefone: document.getElementById('f-telefone').value.trim(),
        salario: document.getElementById('f-salario').value.trim(),
        moradia: document.getElementById('f-moradia').value.trim(),
        status: editando.status
      };
      if (!dados.nome) { alert('Informe o nome do funcionário.'); return; }
      salvarFuncionario(dados);
    });
  }
}

function preservarFoco(id) {
  const el = document.getElementById(id);
  if (el) { const v = el.value; el.focus(); el.value = v; el.selectionStart = el.selectionEnd = v.length; }
}

carregar();
</script>
</body>
</html>
